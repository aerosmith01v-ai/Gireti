<!DOCTYPE html>
<html lang="es">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Chat - Goretti</title>
<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#1a0b2e;color:#fff;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{background:#2a1250;padding:12px 14px;display:flex;align-items:center;gap:12px;border-bottom:2px solid #7c3aed;position:relative;z-index:2}
.avatar{width:48px;height:48px;border-radius:50%;background:#7c3aed;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;border:2px solid #c4b5fd;flex-shrink:0}
header h1{font-size:19px;line-height:1.1}
header p{font-size:12px;color:#d8b4fe}
.dot{width:9px;height:9px;background:#22c55e;border-radius:50%;display:inline-block;margin-right:4px}
#status{font-size:11px;color:#e9d5ff;margin-left:auto;text-align:right}
#chat{flex:1;overflow-y:auto;padding:16px 12px 12px;position:relative;background:#1a0b2e}
/* Fondo apodos gigante */
#chat::before{content:"BICHA \A MONO \A CHURPIA \A BICHA \A MONO \A CHURPIA";white-space:pre;position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:58px;font-weight:900;line-height:1.25;letter-spacing:2px;color:rgba(168,85,247,.14);transform:rotate(-12deg);pointer-events:none;z-index:0}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;font-size:18px;opacity:.35;overflow:hidden}
.msg{position:relative;z-index:1;max-width:82%;padding:9px 11px;border-radius:16px;margin:7px 0;font-size:15px;line-height:1.35;word-break:break-word;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.msg.mine{margin-left:auto;background:#7c3aed;border-bottom-right-radius:4px}
.msg.theirs{background:#312e81;border-bottom-left-radius:4px}
.msg small{display:block;font-size:10px;opacity:.7;margin-top:4px;text-align:right}
.msg img{width:100%;border-radius:10px;display:block;margin-top:6px}
.msg audio{width:100%;margin-top:6px}
#who{display:flex;gap:8px;padding:8px 12px;background:#2a1250;position:relative;z-index:2}
#who button{flex:1;padding:9px;border-radius:999px;border:1px solid #7c3aed;background:transparent;color:#fff;font-weight:700;cursor:pointer}
#who button.active{background:#7c3aed}
#composer{display:flex;gap:8px;align-items:center;padding:10px;background:#2a1250;border-top:1px solid #4c1d95;position:relative;z-index:2}
#composer input[type=text]{flex:1;padding:12px 14px;border-radius:999px;border:1px solid #7c3aed;background:#1a0b2e;color:#fff;outline:none;font-size:15px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:none;background:#4c1d95;color:#fff;font-size:19px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#send{background:#a855f7;font-weight:900}
#typing{font-size:12px;color:#d8b4fe;padding:2px 14px;min-height:16px}
.hint{font-size:11px;text-align:center;color:#c4b5fd;padding:6px}
</style>
</head>
<body>
<header>
<div class="avatar">G</div>
<div><h1>Goretti</h1><p><span class="dot"></span>Bicha • Mono • Churpia</p></div>
<div id="status">Conectando...<br><span id="roomLabel"></span></div>
</header>

<div id="who">
<button id="btnMono" class="active" onclick="setName('Mono')">Soy Mono</button>
<button id="btnGoretti" onclick="setName('Goretti')">Soy Goretti</button>
</div>

<div id="stars">⭐ &nbsp; ✨ &nbsp; ⭐ &nbsp; ✨ &nbsp; ⭐ &nbsp; ✨ &nbsp; ⭐<br><br>&nbsp; ✨ &nbsp; ⭐ &nbsp; ✨ &nbsp; ⭐ &nbsp; ✨</div>
<div id="chat"></div>
<div id="typing"></div>

<div id="composer">
<label class="iconbtn" for="fileInput">📷<input id="fileInput" type="file" accept="image/*" hidden></label>
<button class="iconbtn" id="micBtn" title="Grabar audio">🎤</button>
<input id="textInput" type="text" placeholder="Escribe..." autocomplete="off">
<button class="iconbtn" id="send">➤</button>
</div>
<p class="hint">Mismo link = mismo chat. Si abren el mismo link, se ven los mensajes.</p>

<script>
// --- CONFIG: sala fija para que los dos entren al mismo chat ---
const params = new URLSearchParams(location.search);
const ROOM = params.get('sala') || 'goretti-bicha-mono-churpia-2026';
document.getElementById('roomLabel').textContent = 'Sala: ' + ROOM;

// Gun con relays públicos - sin servidor propio, funciona en GitHub Pages / Render Static
const gun = Gun({ peers: ['https://peer.wallie.io/gun','https://gun-manhattan.herokuapp.com/gun','https://dletta.herokuapp.com/gun'] });
const chatRef = gun.get('chat-goretti-' + ROOM);

let myName = localStorage.getItem('chat-nombre') || 'Mono';
function setName(n){ myName=n; localStorage.setItem('chat-nombre',n);
  document.getElementById('btnMono').classList.toggle('active', n==='Mono');
  document.getElementById('btnGoretti').classList.toggle('active', n==='Goretti');
}
setName(myName);

const chatEl = document.getElementById('chat');
const seen = new Set();
function render(m){
  if(!m || !m.id || seen.has(m.id)) return; seen.add(m.id);
  const d=document.createElement('div');
  d.className='msg ' + (m.from===myName ? 'mine' : 'theirs');
  let inner = `<b>${m.from}</b> `;
  if(m.type==='text') inner += m.text.replace(/</g,'&lt;');
  if(m.type==='image') inner += `<img src="${m.data}">`;
  if(m.type==='audio') inner += `<audio controls src="${m.data}"></audio>`;
  inner += `<small>${new Date(m.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} ✓✓</small>`;
  d.innerHTML=inner; chatEl.appendChild(d); chatEl.scrollTop=chatEl.scrollHeight;
}
// Escuchar mensajes en vivo
chatRef.map().on((data, key)=>{ if(data) render(data); document.getElementById('status').innerHTML='En línea 🟢<br><span>'+ROOM+'</span>'; });
setTimeout(()=>{ if(document.getElementById('status').textContent.includes('Conectando')) document.getElementById('status').innerHTML='Conectado (puede tardar unos segundos)<br><span>'+ROOM+'</span>'; }, 4000);

function sendMsg(obj){
  const id = Date.now()+'-'+Math.random().toString(36).slice(2);
  chatRef.get(id).put({id, from:myName, ts:Date.now(), ...obj});
}
function sendText(){
  const inp=document.getElementById('textInput'); const t=inp.value.trim(); if(!t) return;
  sendMsg({type:'text', text:t}); inp.value='';
}
document.getElementById('send').onclick=sendText;
document.getElementById('textInput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendText(); });

document.getElementById('fileInput').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>sendMsg({type:'image', data:r.result}); r.readAsDataURL(f); e.target.value='';
});

// Audio
let recorder=null, chunks=[];
const micBtn=document.getElementById('micBtn');
micBtn.onclick=async()=>{
  if(recorder && recorder.state==='recording'){ recorder.stop(); micBtn.textContent='🎤'; micBtn.style.background='#4c1d95'; return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    recorder=new MediaRecorder(stream); chunks=[];
    recorder.ondataavailable=e=>chunks.push(e.data);
    recorder.onstop=()=>{ const blob=new Blob(chunks,{type:'audio/webm'}); const r=new FileReader(); r.onload=()=>sendMsg({type:'audio', data:r.result}); r.readAsDataURL(blob); };
    recorder.start(); micBtn.textContent='⏹️'; micBtn.style.background='#ef4444';
  }catch(err){ alert('No se pudo usar el micrófono. Permite el permiso en el navegador.'); }
};
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
